# Pipeline pedagogique : install -> test -> build -> deploy
stages:
  - install
  - test
  - build
  - deploy

default:
  image: node:20-alpine

# Etape 1 : installation des dependances a partir du package-lock.json.
# Le dossier node_modules est mis en cache et transmis aux etapes suivantes.
install:
  stage: install
  script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# Etape 2 : execution de la suite de tests. Le pipeline s'arrete ici si un test echoue.
test:
  stage: test
  needs: [install]
  script:
    - npm test

# Etape 3 : construction de l'image Docker, taguee avec le SHA court du commit.
build:
  stage: build
  needs: [test]
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t api-todo:$CI_COMMIT_SHORT_SHA .

# Etape 4 : deploiement. Staging part automatiquement sur main,
# la production reste manuelle : c'est un humain qui declenche la mise en ligne.
deploy:staging:
  stage: deploy
  needs: [build]
  environment:
    name: staging
  script:
    - echo "Deploiement de api-todo:$CI_COMMIT_SHORT_SHA sur staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:production:
  stage: deploy
  needs: [build]
  environment:
    name: production
  script:
    - echo "Deploiement de api-todo:$CI_COMMIT_SHORT_SHA sur production"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
