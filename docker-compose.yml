services:
  api:
    build: ./api
    environment:
      # "db" est le nom du service, résolu par le réseau interne de compose.
      # Depuis un conteneur, "localhost" désigne le conteneur lui-même :
      # c'est l'erreur la plus fréquente.
      DATABASE_URL: postgres://postgres:${DB_PASS}@db:5432/binggge
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binggge
      # Lu depuis .env (jamais versionné). Utilisé au TOUT PREMIER démarrage
      # seulement : sur un volume existant, changer cette valeur ne change pas
      # le mot de passe réel de la base.
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chargé automatiquement au tout premier démarrage, quand pgdata est vide.
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d binggge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: