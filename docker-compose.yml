services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binggge
      POSTGRES_PASSWORD: binggge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chargé automatiquement au tout premier démarrage, quand pgdata est vide.
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d binggge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      # "db" est le nom du service, résolu par le réseau interne de compose.
      # C'est ce qui remplace le "localhost" du lancement à la main.
      DATABASE_URL: postgres://postgres:binggge@db:5432/binggge
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: