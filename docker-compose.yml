services:
  front:
    build: ./front
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    # Contexte = racine du dépôt : l'image de l'API embarque aussi le front.
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # "db" est le nom du service, résolu par le réseau interne de compose.
      # Depuis un conteneur, "localhost" désigne le conteneur lui-même :
      # c'est l'erreur la plus fréquente.
      DATABASE_URL: postgres://postgres:${DB_PASS}@db:5432/binggge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binggge
      # Lu depuis .env (jamais versionné). Utilisé au TOUT PREMIER démarrage
      # seulement : sur un volume existant, changer cette valeur ne change pas
      # le mot de passe réel de la base.
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      # Volume nommé uniquement : le serveur interdit les montages de dossiers
      # de l'hôte. Le schéma est chargé à la main après le premier déploiement.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d binggge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
